<script type="text/markdown" id="md-src"># 레슨 05 · 도구 호출

AI 모델이 텍스트 생성을 넘어 직접 "행동"하게 만드는 핵심 기능, 도구 호출(Tool Calling)을 알아봅니다.

## 학습 목표

- 도구 호출이 무엇인지, 왜 AI를 훨씬 더 유용하게 만드는지 설명할 수 있다.
- 도구 호출의 동작 4단계와 도구 정의의 3요소(name / description / parameters)를 이해한다.
- 도구 호출이 토큰(비용)에 어떤 영향을 주는지, 그리고 MCP가 무엇인지 감을 잡는다.

---

## 도구 호출이란?

앞 레슨에서 AI 모델을 "API 엔드포인트"에 비유했죠. 도구 호출은 그 모델이 스스로 **다른 API를 호출**할 수 있게 해 주는 기능입니다. 모델이 새로운 능력을 하나 더 익히는 셈이에요.

쉬운 비유를 들어볼게요. 전화로 친구의 저녁 요리를 도와준다고 상상해 보세요. 내가 아는 지식으로 지시를 줄 수는 있지만, 친구의 **냉장고 안에 뭐가 있는지 볼 수도 없고**, 만들고 있는 음식을 **맛볼 수도** 없습니다. 답답하죠.

그런데 친구가 냉장고 안 **사진을 찍어 보내**거나, **오븐의 정확한 온도**를 알려 준다면 어떨까요? 실시간 정보가 손에 들어오니 훨씬 더 정확한 조언을 할 수 있습니다.

바로 이것이 AI 모델에서 도구 호출이 하는 일입니다. 도구가 없으면 모델은 "사용자가 직접 말해 준 내용"만 가지고 추론해야 합니다. 도구가 있으면 파일을 읽고, 웹을 검색하고, 명령을 실행하며 ==세상과 직접 상호작용==할 수 있습니다.

> [!EXAMPLE] 이미 써 본 도구 호출
> 사실 우리는 이미 도구 호출을 써 봤습니다. ChatGPT에 이미지 생성, 웹 검색, 코드 실행을 시키면 백그라운드에서 도구가 동작하는 거예요.

---

## 동작 4단계

개발자는 AI 애플리케이션을 만들 때, 모델이 쓸 수 있는 "도구" 목록을 미리 정의해 둡니다. 그러면 실제 대화에서는 다음 4단계로 흘러갑니다.

```mermaid
flowchart LR
  A[1 판단<br/>도구가 필요한가] --> B[2 도구 요청<br/>JSON 출력]
  B --> C[3 앱이 실행<br/>실제 도구 동작]
  C --> D[4 결과 반영<br/>컨텍스트에 추가]
```

정리하면 이렇습니다.

1. **판단** — 모델이 요청을 받고 "내 지식만으론 부족하다, 도구가 필요하다"고 판단합니다.
2. **도구 요청(JSON)** — 어떤 도구를 쓸지, 어떤 매개변수를 넘길지 지정하는 특수한 JSON 응답을 만듭니다. (모델 자신이 도구를 실행하는 게 아니라, "이걸 실행해 줘"라고 요청하는 것)
3. **앱이 실행** — 애플리케이션이 그 도구를 실제로 실행하고 결과를 가져옵니다.
4. **결과 반영** — 모델이 그 결과를 컨텍스트에 받아들이고, 그걸 토대로 대화를 이어 갑니다.

> [!IMPORTANT] 핵심 포인트
> 모델은 도구를 ==직접 실행하지 않습니다.== "실행해 달라"고 요청만 하고, 실제 실행은 앱(애플리케이션)이 합니다.

### 도구가 실패하면? — 모델의 "자기수정"

도구가 항상 성공하는 건 아닙니다. 없는 파일을 읽으려 하거나, 인자를 잘못 넘기기도 하죠. 이때 ==앱이 예외를 던지며 멈춰서는 안 됩니다.== 대신 **에러 메시지 자체를 도구 결과로 모델에게 되돌려** 줍니다.

```text
모델: read_file("confgi.json")   ← 오타
앱  : (4단계 결과) "Error: 'confgi.json' 파일이 없습니다.
       비슷한 파일: config.json"
모델: 아, 오타였군. read_file("config.json")   ← 스스로 고침
```

이렇게 하면 모델은 에러를 읽고 ==스스로 인자를 고쳐 다시 시도==합니다. 사람이 끼어들 필요가 없죠. 실패를 "죽는 사건"이 아니라 "다음 행동을 위한 정보"로 바꿔 주는 것 — 이것이 에이전트(레슨 06)가 끈질기게 일을 해내는 비결입니다.

### 코딩에서 도구가 강력한 이유

AI 코딩 도구(예: Cursor)에서 도구는 모델이 다음을 할 수 있게 해 줍니다.

- 코드베이스의 파일을 읽고 쓰기
- 관련 함수나 패턴을 찾기 위해 코드 검색하기
- 셸 명령으로 테스트 실행, 패키지 설치하기
- 문서 접근 / 웹 검색으로 최신 정보 얻기
- 린터·테스트를 돌려 오류 확인하기

## 도구 정의의 3요소

모든 도구 정의에는 ==세 가지 핵심 구성 요소==가 들어갑니다. [[chip:info: name / description / parameters]]

- **이름(name)** — `read_file`, `search_web` 처럼 도구를 식별하는 이름
- **설명(description)** — 이 도구를 **언제, 어떻게** 써야 하는지 모델에게 알려 주는 문장
- **매개변수(parameters)** — 도구가 동작하는 데 필요한 입력값

도구 정의는 대략 이런 모습입니다(개념 이해용).

```json
{
  "name": "read_file",
  "description": "Read the contents of a file from the codebase",
  "parameters": {
    "filepath": "The path to the file to read"
  }
}
```

모델이 이 도구를 쓰고 싶을 때는, 매개변수를 채운 요청을 이렇게 만들어 냅니다.

```json
{
  "tool": "read_file",
  "parameters": {
    "filepath": "src/components/Button.tsx"
  }
}
```

그러면 앱이 해당 파일을 읽어 그 내용을 대화 컨텍스트에 추가합니다. 덕분에 모델은 Button 컴포넌트를 이해하고 알맞은 수정안을 제안할 수 있게 되죠.

### 설명(description)이 도구의 품질을 좌우합니다

세 요소 중에서 모델이 "이 도구를 **언제** 꺼내 쓸지"를 결정하는 건 바로 **설명**입니다. 모델은 도구의 내부 코드를 보지 못해요. 오직 설명 문장만 읽고 판단합니다. 그래서 설명이 부실하면, 멀쩡한 도구도 엉뚱한 때 호출되거나 아예 안 쓰입니다.

같은 도구를 두고 설명만 바꿔 보겠습니다.

```text
❌ BEFORE — 무엇을 하는지만 (모델이 언제 쓸지 모름)
   "description": "Search the database"

✅ AFTER — 언제 써야 하는지가 담김
   "description": "사용자 정보를 ID나 이메일로 조회할 때 사용.
    주문 내역이 아니라 '계정' 정보가 필요할 때만 쓸 것."
```

BEFORE는 "검색한다"는 사실만 말합니다. 모델은 주문 검색에도, 상품 검색에도 이 도구를 꺼내 쓸지 헷갈리죠. AFTER는 ==쓰는 상황과 쓰지 말아야 할 상황==까지 알려 줍니다. 그 결과 호출 정확도가 눈에 띄게 올라갑니다. 설명은 "이 도구가 무엇인가"보다 **"언제 이 도구를 골라야 하는가"**를 적는다고 기억하세요.

### 실행 전, 인자 검증과 승인(권한 경계)

모델이 보낸 인자를 앱은 무조건 믿지 않습니다. 실행 직전에 ==인자가 안전한 범위인지 검증==하고, 위험한 작업(파일 삭제, 결제 등)은 사용자 승인을 한 번 받는 ==권한 경계==를 둡니다. 모델이 요청해도, 실제로 실행할지는 앱이 결정해요.

---

## 도구는 토큰을 어떻게 쓰나?

앞에서 토큰과 비용 이야기를 했죠. 도구 호출은 **두 가지 방식**으로 토큰을 더 씁니다.

- **도구 정의가 입력 토큰을 추가** — 정의가 입력 컨텍스트에 항상 포함됩니다(보통 도구당 수백 토큰).
- **도구 결과가 출력/컨텍스트에 추가** — 도구가 돌려주는 내용만큼 토큰이 늘어납니다(반환량에 따라 달라짐).

즉, 도구를 많이 쓰는 대화일수록 컨텍스트 윈도우가 더 빨리 차고 비용도 올라갑니다. 다만 실시간 정보 접근으로 얻는 효용이 워낙 크기 때문에, 보통 이 트레이드오프는 충분히 가치가 있습니다.

> [!NOTE] 참고
> 도구 호출이 일어나면 모델은 그 시점까지의 컨텍스트를 다시 평가합니다. AI 코딩 도구(예: Cursor)에서는 컨텍스트를 모델에 재전송하므로, 캐시된 입력 토큰 사용량이 더 많이 표시될 수 있습니다.

---

## MCP — 도구계의 USB

최근 ==MCP(Model Context Protocol)== 라는 표준이 등장했습니다. AI 모델이 여러 애플리케이션의 도구를 일관된 방식으로 사용·통합하게 해 주는 **범용 규격**입니다. [[chip:new: 도구계의 USB]]

**USB**를 떠올려 보세요. USB라는 표준 덕분에 어떤 기기든 컴퓨터에 꽂으면 동작하죠. MCP도 마찬가지로, 도구를 AI 모델에 연결하는 표준을 지향합니다.

MCP의 핵심 가치는 **재사용**입니다. 표준이 없다면 같은 "DB 조회 도구"를 앱마다 따로 다시 만들어야 합니다(앱이 3개면 3번). MCP라는 공통 규격을 따르면 ==도구를 한 번만 만들어 두고, 어떤 AI 앱에서든 그대로 꽂아 쓸 수 있습니다.== USB 충전기 하나로 여러 기기를 충전하듯이요.

> [!NOTE] 도구 예시 (Cursor)
> 이미 만들어진 MCP 서버(예: Figma, Linear)를 Cursor에 등록하면, 그 도구들을 Cursor 안에서 바로 호출할 수 있습니다. 같은 서버를 다른 MCP 지원 앱에 연결해도 똑같이 동작합니다 — 이것이 "한 번 만들어 여러 곳에서"의 실제 모습입니다.

예를 들면 이렇게 활용합니다.

- 디자인 파일을 위해 **Figma**에 연결
- 이슈 열람·관리를 위해 **Linear**에 연결
- **데이터베이스**에 연결해 데이터를 직접 쿼리
- 사내 도구·API 통합을 위해 **자체 MCP 서버**를 직접 제작

---

## 💡 한 문장 요약

> [!IMPORTANT] 한 문장 요약
> 도구 호출은 AI 모델이 ==판단 → 도구 요청(JSON) → 앱이 실행 → 결과 반영==의 4단계로 세상과 상호작용하게 해 주는 기능이며, MCP는 그 도구들을 어디서나 꽂아 쓰게 만드는 USB 같은 표준이다.

## ✅ 확인 문제

**Q1. 도구 정의의 핵심 구성 요소는 무엇인가요?**

- 정답: **Name(이름), Description(설명), Parameters schema(매개변수)**
- 해설: 도구 정의는 이름·설명·매개변수 3요소로 이뤄집니다. "Provider API key(공급자 API 키)"는 도구 정의의 구성 요소가 **아닙니다** — 인증은 도구 정의와 별개의 영역이에요.

**Q2. 도구 호출이 토큰 사용에 영향을 주는 두 가지 방식은?**

- 정답: **① 도구 정의가 입력 토큰을 추가한다, ② 도구 결과가 출력 토큰을 추가한다.**
- 해설: 도구는 한 번 정의했다고 무료가 아니며(정의가 입력 컨텍스트에 매번 포함됨), 스트리밍이 토큰 비용을 없애 주지도 않습니다. 비용은 "정의(입력) + 결과(출력)" 양쪽에서 발생합니다.
