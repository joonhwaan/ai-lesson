<script type="text/markdown" id="md-src"># 세션 7 해설 스크립트 — 안전하게 운영하기: 환경으로 강제하는 가드레일

> 🎙️ 이 문서는 강사가 그대로 읽거나 참고해 설명할 수 있는 해설 대본입니다. 본문: [세션 7 강의 자료](session-07.html)
>
> (기준 시점 2026-06 · 설정 키·문법은 버전마다 바뀌니 공식 문서·`/hooks`·`/permissions`로 확인하라고 안내)

## [프레이밍 · 10분] 습관이 아니라 환경으로 강제한다

🎙️ 자, 드디어 마지막 일곱 번째 시간이에요. 지금까지 여섯 세션 동안 코딩 에이전트를 **빠르게** 쓰는 법을 배웠죠. 오늘은 마지막으로 **안전**을 다뤄요. 그런데 제가 오늘 가장 강조하고 싶은 한 가지가 있어요.

안전은 "조심하자"는 **습관이 아니에요.** 습관은 새요. 바쁠 때, 자동 승인을 켰을 때, 새 팀원이 모를 때 뚫려요. 진짜 안전은 **환경이 막아주는** 거예요. 비유하면, 금고에 "열지 마시오" 안내문을 붙이는 거랑, 금고를 **실제로 잠그는** 건 완전히 다르잖아요. 오늘은 잠그는 법을 배웁니다.

🎙️ 그래서 오늘의 한 줄은 이거예요 — **가드레일은 프롬프트에 부탁하는 게 아니라, 프로젝트 환경에 박아서 강제한다.** 내가 쓰는 코딩 에이전트는 모델에 루프, 컨텍스트, 도구, 권한이 묶인 하나의 **하네스**예요. 그 하네스를 설정으로 가두는 게 안전 엔지니어링이에요. 하네스를 직접 *설계*하는 건 심화 과정 얘기고, 우리는 *구성해서 강제*하는 거예요.

🎙️ 화면의 4겹 방어를 보세요. 1겹은 권한 규칙, settings.json의 deny와 allow. 2겹은 훅, 실행 직전에 런타임으로 차단. 3겹은 샌드박스와 Dev Container, 환경 자체를 격리. 4겹은 저장소 게이트, 보호 브랜치와 pre-commit과 CI예요. 핵심은 **겹쳐서 쓴다**는 거예요. 한 겹은 반드시 구멍이 있어요. 그런데 네 겹을 겹치면, 하나를 뚫어도 다음 겹이 잡아요. 양파처럼요.

## [1겹 · 22분] 권한 규칙과 설정 계층

🎙️ 첫 번째 겹, 권한 규칙이에요. 코딩 에이전트는 보통 `.claude/settings.json`의 `permissions`로 무엇을 허용하고, 차단하고, 확인할지를 규칙으로 정해요. 화면 JSON을 보세요. deny에 `rm -rf`, `git push --force`, `git reset --hard`, 그리고 `.env`나 `~/.ssh` 읽기를 넣었어요. ask에는 `git push`, allow에는 테스트나 커밋 같은 안전한 것들이요.

🎙️ 여기서 가장 중요한 규칙 하나 — **deny가 최우선이에요.** 평가 순서가 deny, ask, allow인데, deny에 걸리면 즉시 차단되고 어떤 allow도 그걸 못 되살려요. 그래서 위험 명령이랑 시크릿 파일은 deny에 박아두는 게 1차 방어예요. 특히 `Read(.env)`로 시크릿 읽기를 원천 차단하는 거, 이게 인젝션 방어의 핵심이기도 해요.

🎙️ 그 다음이 정말 실전적인데, **설정 계층**이에요. 어디에 두느냐가 곧 "누구에게 강제하느냐"예요. 화면 표를 보세요. `~/.claude/settings.json`은 내 모든 프로젝트에 적용되는 개인 기본값. `.claude/settings.json`은 이 저장소 전체에 적용되는데, **이걸 git에 커밋하면 팀 전원에게 강제**돼요. `.claude/settings.local.json`은 gitignore되는 개인 실험용. 그리고 조직이 배포하는 managed 설정은 아예 오버라이드가 안 되는 강제 정책이에요.

🎙️ 그러니까 팀 가드레일을 만들고 싶으면, `.claude/settings.json`에 deny 규칙을 적고 **저장소에 커밋**하세요. "각자 조심해"가 아니라 "레포가 막는다"가 되는 거예요. 이게 습관과 환경의 결정적 차이예요.

💬 예상 질문: "권한 모드는요?" → 화면 표처럼 작업 위험도에 맞춰 골라요. default는 읽기만 자동, plan은 수정 없이 탐색만, acceptEdits는 수정까지 자동, dontAsk는 미리 allow한 것만(CI용), 그리고 bypassPermissions는 전부 자동인데 — 이건 격리 환경에서만요. 4겹에서 다시 얘기할게요.

## [2겹 · 20분] 훅(PreToolUse)으로 런타임 차단

🎙️ 두 번째 겹, 훅이에요. 1겹의 정적 규칙은 한계가 있어요. **변형**을 못 잡아요. `rm -rf`는 막아도 `find . -delete`는요? `DROP TABLE`은요? 규칙으로 일일이 다 적을 수가 없죠.

그래서 **PreToolUse 훅**이 필요해요. 도구가 실행되기 직전에 스크립트를 돌려서, 입력을 검사하고 막는 거예요. 화면을 보세요. settings.json의 `hooks.PreToolUse`에 Bash 매처로 스크립트를 등록하고요. 스크립트는 stdin으로 들어온 JSON에서 `jq`로 명령을 꺼내서, 위험 패턴이 보이면 **`exit 2`로 차단**해요. exit 2가 핵심인데, 이게 blocking error라서 도구 실행을 막고 stderr 메시지가 사용자한테 전달돼요.

🎙️ 차단 방식은 두 가지가 있어요. 가장 단순하고 안정적인 건 방금 본 `exit 2`. 그리고 stdout으로 JSON 결정을 내보내는 방식도 있는데, 정확한 필드 이름은 버전마다 다를 수 있으니 **공식 hooks 문서를 꼭 확인**하세요. 일단 exit 2부터 쓰면 돼요.

🎙️ 그리고 중요한 관계 하나 — **훅은 권한 규칙보다 약해요.** deny 규칙이 더 강하게, 먼저 차단해요. 그러니까 정적으로 표현 가능한 건 deny에 넣고, deny로 못 잡는 동적 패턴만 훅으로 잡는 거예요. 둘은 경쟁이 아니라 보완 관계예요. 규칙이 1차 그물, 훅이 더 촘촘한 2차 그물이라고 보면 돼요.

## [3겹 · 16분] 샌드박스와 Dev Container 격리

🎙️ 세 번째 겹이에요. 규칙이랑 훅을 다 뚫었다고 쳐요. 그래도 **실행 환경 자체를 격리**해두면 피해가 갇혀요. 두 층위가 있어요.

🎙️ 첫째, 내장 샌드박스예요. 화면처럼 settings.json의 sandbox 설정으로, 쓰기는 작업 디렉터리랑 임시 폴더로만 제한하고, `~/.aws`나 `~/.ssh` 같은 시크릿 읽기는 차단하고, 네트워크는 허용 도메인만 열어요. 이게 macOS는 Seatbelt, Linux는 bubblewrap이라는 OS 수준 기술로 강제돼요. 윈도우는 WSL2를 써야 하고요.

🎙️ 둘째, Dev Container예요. 이건 더 강력해요. 호스트에서 통째로 분리하는 거예요. 화면의 devcontainer.json처럼 컨테이너 안에서 에이전트를 돌리면, **호스트 파일시스템이나 자격증명에 아예 접근을 못 해요.** 방화벽으로 아웃바운드도 필수 도메인만 열고요.

🎙️ 그리고 여기서 아까 미뤘던 `bypassPermissions` 얘기. 전부 자동 승인이라 빠르고 편하지만 위험하다고 했죠. 이게 **안전해지는 유일한 조건**이 바로 이 격리예요. 컨테이너 안에서라면, 사고가 나도 컨테이너에 갇히니까 bypass를 켜도 돼요. 호스트에서 bypass는 절대 안 돼요. 시험 운전은 텅 빈 주차장에서 하는 거예요.

## [4겹 · 12분] 저장소 게이트 — 에이전트 밖

🎙️ 마지막 네 번째 겹. 여기 정말 중요한 사실이 하나 있어요. **에이전트 설정만으로는 잘못된 코드가 main에 들어가는 걸 못 막아요.** 1겹부터 3겹까지는 다 "에이전트가 사고치는 것"을 막는 거였어요. 4겹은 "사고가 배포되는 것"을 막아요. 층이 달라요.

🎙️ 그래서 에이전트가 우회할 수 없는 플랫폼 차원의 관문을 둬요. 화면 표를 보세요. 보호 브랜치 — GitHub Branch protection으로 main 직접 push랑 강제 push를 막고, 필수 리뷰랑 CI를 걸고, 관리자도 포함시켜요. pre-commit 훅 — gitleaks 같은 걸로 커밋할 때 시크릿을 스캔해요. CI 게이트 — PR마다 테스트랑 시크릿 스캔을 통과해야 머지되게요. 화면 아래 GitHub Actions 예시가 그거예요, PR마다 gitleaks로 시크릿 유출을 막죠.

🎙️ 핵심은 — 에이전트를 신뢰하든 안 하든, 이 마지막 관문은 늘 둬요. 에이전트가 실수해도 보호 브랜치랑 CI가 마지막에 거르니까요.

## [정리 · 8분] 마지막 한 겹은 습관 + 트랙 종합

🎙️ 자, 설정이랑 훅이랑 격리랑 게이트를 다 깔았으면, 그 위에 **보조로** 습관을 얹어요. 단, 이건 지침이지 강제가 아니에요. 외부 데이터는 신뢰 불가다, 그러니까 fetch한 이슈나 웹의 숨은 지시를 명령으로 따르지 말자 — 좋은 습관이죠. 비가역 작업은 한 번 멈춰 확인하자 — 좋은 습관이고요. 하지만 정말 막아야 하면? 1겹 deny랑 2겹 훅으로 강제하는 거예요.

🎙️ 그래서 다시, 오늘의 가장 큰 교훈 — **`CLAUDE.md`에 "rm 하지 마"라고 적는 건 지침이에요.** 항상 막으려면 deny 규칙이랑 훅이랑 보호 브랜치 같은 강제 수단으로 이중화해야 해요. "적었으니 됐다"가 안전의 silent fail이에요.

🎙️ 일곱 세션을 마무리할게요. 트랙 전체를 두 단어로 묶으면 — **빠르게, 그리고 환경으로 안전하게**예요. 세션 1부터 6까지 탐색에서 커밋까지의 흐름을 빠르게 굴리는 법을 배웠고, 오늘 그 힘을 설정·훅·격리·저장소 게이트로 가두는 법을 익혔어요. 안전은 조심하는 마음이 아니라 레포에 박아 강제하는 환경이에요. 액셀만 있는 차는 위험하잖아요, 핸들과 브레이크를 구조로 갖춰야죠. 자, 이제 여러분의 레포에 첫 deny 규칙 한 줄부터 박아보세요. 그게 진짜 시작이에요. 일곱 세션 동안 정말 수고 많으셨습니다. 마지막 질문 받을게요.</script>
