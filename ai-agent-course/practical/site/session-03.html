<script type="text/markdown" id="md-src"># 세션 03 — 스킬(Skills) 만들고 쓰기

> 세션 2에서 만든 **커스텀 커맨드**는 내가 `/`로 직접 호출했다. 이번엔 한 단계 위 — ==필요한 상황이 오면 에이전트가 알아서 꺼내 쓰는== **스킬**을 만든다. 그리고 "규칙(항상) vs 스킬(필요할 때) vs 커맨드(내가 호출)"의 경계를 또렷이 가른다.
>
> [[chip:info: 기준 시점 2026-06]] 스킬의 폴더 구조·필드 이름은 버전마다 다를 수 있다. 여기 나온 건 ==대표 예시==이고, 핵심은 "자동 발동되는 재사용 능력"이라는 ==원리==다. 정확한 형식은 내 환경 문서로 확인한다.

## 학습 목표

- **규칙 · 스킬 · 커맨드**를 발동 방식으로 또렷이 구분한다
- 스킬이 ==상황에 맞으면 자동으로 발동==되는 원리를 이해한다
- 스킬을 직접 작성한다 — 폴더 구조와 `SKILL.md`의 핵심 필드
- 스킬을 **팀과 공유**한다 (레포에 넣기 / 플러그인으로 배포)
- ==스킬을 너무 많이 만드는== 함정을 경계한다

## 회차 타임라인 (총 90분)

| 시간 | 구간 | 내용 |
|------|------|------|
| 0–8분 | 프레이밍 | 커맨드는 내가 부른다, 스킬은 알아서 온다 |
| 8–28분 | 핵심① | 규칙 vs 스킬 vs 커맨드 비교 |
| 28–46분 | 핵심② | 발동 원리 — `description`이 곧 트리거 |
| 46–68분 | 핵심③ | 스킬 직접 작성 (`SKILL.md`) |
| 68–80분 | 핵심④ | 팀 공유 + 과한 스킬 경계 |
| 80–90분 | 실습·정리 | 내 반복 워크플로 하나를 스킬로 |

---

## 1. 스킬이란 — 알아서 발동되는 재사용 능력

세션 2의 커스텀 커맨드는 ==내가 `/이름`으로 호출==해야 동작했다. 스킬은 다르다. **필요한 상황이 오면 에이전트가 스스로 "이 능력을 써야겠다"고 판단해 꺼내 쓴다.**

```text
커맨드:  내가 /pr-check 라고 쳐야 → 리뷰 워크플로 실행   (내가 호출)
스킬:    "이 PDF에서 표 좀 뽑아줘" 라고만 해도 → 관련 스킬이 자동 발동  (알아서)
```

스킬은 한 폴더에 묶인 ==재사용 가능한 능력 묶음==이다. "이럴 때 이렇게 하라"는 절차와, 필요하면 보조 파일·스크립트까지 담는다. 에이전트는 그 묶음의 **설명**을 보고 지금 상황에 맞는지 판단한다.

> [!NOTE] 셋 다 "내가 시키는 일을 줄여주는" 도구
> 규칙·스킬·커맨드는 경쟁 관계가 아니라 ==발동 방식이 다른 세 손잡이==다. 항상 필요한 건 규칙, 내가 직접 부르고 싶은 건 커맨드, 상황 맞으면 알아서 오길 바라는 건 스킬. 이 구분이 오늘의 뼈대다.

---

## 2. 규칙 vs 스킬 vs 커맨드

셋의 결정적 차이는 ==무엇이 발동을 일으키는가==다.

| | 규칙 | 스킬 | 커맨드 |
|------|------|------|--------|
| **발동 방식** | ==항상 주입== — 매 대화에 늘 적용 | ==상황 맞으면 자동== — 에이전트가 판단 | ==내가 `/`로 호출== — 명시적 |
| **누가 켜나** | 자동(상시) | 에이전트(필요 시) | 나(직접) |
| **용도** | 모든 작업에 깔리는 전제·관례 | 가끔 필요한 ==전문 절차/능력== | 자주 반복하는 ==고정 워크플로== |
| **담는 것** | 짧은 지침 위주 | 절차 + 보조 파일·스크립트까지 | 프롬프트 절차(+`!`·`@`) |
| **예시** | "들여쓰기는 2칸", "커밋 메시지는 한글로" | "PDF 표 추출", "이 사내 API 호출 규약" | `/pr-check`, `/release-note` |

- **규칙**(`CLAUDE.md` 등)은 ==항상== 켜져 있다. 그래서 모든 작업에 늘 참인 것만 넣는다. 가끔만 쓰는 걸 규칙에 넣으면 매번 컨텍스트만 잡아먹는다.
- **커맨드**는 ==내가 의식적으로 부른다==. 언제 쓸지 내가 안다.
- **스킬**은 그 중간 — ==평소엔 잠자코 있다가 상황이 맞으면 깨어난다==.

> [!TIP] "항상이냐 / 가끔이냐 / 내가 부르냐"로 고르기
> 새 능력을 추가할 때 한 줄 질문: **늘 필요한가? → 규칙.** **가끔, 특정 상황에만? → 스킬.** **내가 직접 부르고 싶나? → 커맨드.** 이 셋만 구분하면 90%는 정리된다.

---

## 3. 발동 원리 — `description`이 곧 트리거

스킬이 자동으로 불려 나오는 비밀은 단순하다. **각 스킬에는 "언제 쓰는지"를 적은 `description`이 있고, 에이전트는 그 설명을 읽고 지금 상황에 맞으면 발동한다.** 즉 ==description이 곧 트리거 조건==이다.

```text
[발동의 흐름]
1. 사용자가 요청 → "이 엑셀에서 매출 합계 좀 계산해줘"
2. 에이전트가 등록된 스킬들의 description을 훑음
3. "스프레드시트 데이터 집계가 필요할 때 사용" 같은 설명과 매칭
4. → 그 스킬을 발동해 절차대로 수행
```

그래서 ==좋은 description이 곧 발동률==이다. 설명이 또렷하면 제때 불려 나오고, 모호하면 영영 안 불려 나온다.

| 나쁜 description | 왜 안 좋나 | 좋은 description |
|------|------|------|
| "유틸리티" | 언제 쓰는지 없음 → 영영 안 발동 | "PDF에서 표를 추출해 CSV로 변환할 때 사용" |
| "데이터 처리" | 너무 넓음 → 엉뚱하게 오발동 | "사내 결제 로그(JSON)를 일자별로 집계할 때" |
| "도와주는 도구" | 트리거 상황이 없음 | "React 컴포넌트에 접근성(a11y) 점검이 필요할 때" |

> [!IMPORTANT] description은 "기능 설명"이 아니라 "발동 조건"이다
> 흔한 실수: description에 ==무엇을 하는지==만 적고 ==언제 쓰는지==를 빠뜨린다. "표를 CSV로 바꾼다"보다 **"~할 때 사용한다"**가 핵심이다. 에이전트는 *상황*을 보고 고르지, 기능 목록을 보고 고르지 않는다.

---

## 4. 스킬 직접 작성 — `SKILL.md`

스킬은 ==폴더 하나==로 만든다. 핵심은 그 안의 `SKILL.md`다.

```bash
# 위치 (대표 예시 · 버전마다 다를 수 있음)
.claude/skills/<스킬이름>/SKILL.md     # 프로젝트(팀 공유, git에 커밋)
~/.claude/skills/<스킬이름>/SKILL.md    # 개인(모든 프로젝트)

# 폴더 안에 보조 파일·스크립트를 함께 둘 수도 있음
.claude/skills/pdf-table/SKILL.md
.claude/skills/pdf-table/extract.py    # 절차가 부르는 헬퍼(선택)
```

`SKILL.md`는 마크다운이고, **이름 · 언제 쓰는지(description) · 절차 · 예시**를 담는다.

```markdown
<!-- .claude/skills/pdf-table/SKILL.md -->
---
name: pdf-table
description: PDF 문서에서 표를 추출해 CSV로 변환할 때 사용한다.
             "표 뽑아줘", "PDF를 표로" 같은 요청이 트리거.
---

# PDF 표 추출

## 언제 쓰나
사용자가 PDF 안의 표 데이터를 구조화(CSV/마크다운 표)하길 원할 때.

## 단계
1. 대상 PDF 경로를 확인한다 (없으면 묻는다).
2. `extract.py` 로 페이지별 표를 파싱한다.
3. 헤더를 정규화하고 빈 셀은 빈 문자열로 둔다.
4. 결과를 CSV로 저장하고, 행/열 수를 한 줄로 보고한다.

## 예시
입력: "report.pdf 3페이지 표를 csv로"
출력: report_p3.csv (12행 × 5열) 저장 완료
```

- **`name`**: 스킬의 짧은 식별자(보통 폴더 이름과 맞춤).
- **`description`**: §3에서 본 ==발동 조건==. 가장 중요한 한 줄.
- **본문**: "언제 쓰나 → 단계 → 예시" 순으로 ==사람이 읽듯== 또렷이. 절차가 길면 보조 파일로 뺀다.

> [!NOTE] 커맨드 작성(세션 2)과 닮았지만 결정적 차이 하나
> 둘 다 마크다운 + frontmatter다. 하지만 커맨드는 `/이름`으로 ==내가 호출==하고, 스킬은 `description`을 보고 ==에이전트가 호출==한다. 그래서 스킬은 description에 모든 게 걸려 있다.

---

## 5. 팀 공유 + 과한 스킬 경계

### 팀과 나누기

스킬을 ==프로젝트 경로(`.claude/skills/`)에 두고 git에 커밋==하면, 그 레포를 받은 팀원 모두가 같은 능력을 갖는다. 사내 API 호출 규약, 우리 팀만의 배포 체크리스트 같은 ==조직 지식==을 스킬로 굳히면 강력하다.

```text
공유 경로:   .claude/skills/<이름>/   → 레포에 커밋 → 팀 전체 공유
개인 경로:   ~/.claude/skills/<이름>/ → 나만 사용
배포형:      플러그인 형태로 묶여 배포되는 스킬도 있음(설치하면 함께 따라옴)
```

> [!TIP] 스킬은 "팀의 노하우"를 코드처럼 버전 관리한다
> 베테랑 머릿속에만 있던 "이건 이렇게 처리해"를 스킬로 적어 커밋하면, 신규 멤버의 에이전트도 그 노하우를 ==자동으로== 꺼내 쓴다. 문서로만 두면 아무도 안 읽지만, 스킬은 상황이 오면 알아서 발동한다.

### ==과한 스킬 경계==

스킬이 강력하다고 ==아무거나 다 스킬로 만들면 역효과==다. 스킬이 너무 많으면:

- 에이전트가 ==어떤 걸 써야 할지 혼동==하거나, 엉뚱한 스킬을 ==오발동==한다.
- description끼리 겹쳐서 ==잘못 매칭==된다(§3의 "너무 넓은 description" 문제가 떼로 발생).
- 관리·유지보수 부담만 늘고 정작 발동은 안 된다.

> [!WARNING] 진짜 반복되는 워크플로만 스킬로
> 한 번 쓰고 말 일, 매번 내용이 달라지는 일은 스킬로 만들지 마라. ==정말 반복되고, 절차가 고정되고, 자동 발동이 이득인== 것만 스킬로 굳힌다. (세션 2 커맨드의 "3번 이상 + 단계 고정" 기준과 같은 정신이다.) 스킬 개수는 적고 또렷할수록 좋다.

---

## 📚 실전 예제 모음

§4에서 `pdf-table` 하나를 봤다. 이번엔 ==도메인이 다른 SKILL.md 4개==를 나란히 놓고 본다. 핵심은 본문 절차가 아니라 ==`description`이 서로 어떻게 다른가== — 즉 "어떤 상황에서 깨어나는가"다. 같은 형식이지만 트리거가 또렷이 갈린다.

### 예제 1 — 커밋 메시지 규약 적용

팀이 정한 커밋 컨벤션(Conventional Commits 등)을 ==커밋을 만들 때마다== 자동으로 챙기게 한다.

```markdown
<!-- .claude/skills/commit-convention/SKILL.md -->
---
name: commit-convention
description: 변경분을 커밋할 때 우리 팀 커밋 메시지 규약(Conventional Commits)을
             적용해 메시지를 작성한다. "커밋해줘", "커밋 메시지" 요청이 트리거.
---

# 커밋 메시지 규약

## 언제 쓰나
사용자가 변경분을 커밋하려 하거나 커밋 메시지를 작성해 달라고 할 때.

## 단계
1. `!git diff --staged` 로 무엇이 바뀌는지 파악한다.
2. 타입을 고른다: feat / fix / docs / refactor / test / chore.
3. `<타입>: <한글 요약>` 형식으로 제목을 쓴다 (50자 이내, 마침표 없음).
4. 본문이 필요하면 "왜" 바꿨는지 한두 줄 덧붙인다.
5. 작성한 메시지를 보여주고 승인받은 뒤 커밋한다.

## 예시
입력: "방금 로그인 버그 고친 거 커밋해줘"
출력: fix: 로그인 시 토큰 만료 검사 누락 수정
```

### 예제 2 — API 엔드포인트 문서 자동 생성

새 라우트를 추가했을 때 ==API 문서를 빠뜨리지 않도록== 자동으로 챙긴다.

```markdown
<!-- .claude/skills/api-doc/SKILL.md -->
---
name: api-doc
description: 새 API 엔드포인트(라우트)를 추가·수정했을 때 그에 맞는 API 문서를
             생성·갱신한다. 라우트 코드 작성 직후나 "이 엔드포인트 문서화" 요청이 트리거.

# API 엔드포인트 문서

## 언제 쓰나
Express/FastAPI 등에서 라우트를 새로 만들거나 바꾼 직후, 또는 문서화를 요청받을 때.

## 단계
1. 대상 라우트의 메서드·경로·핸들러를 읽는다.
2. 요청(쿼리·바디·헤더)과 응답(필드명·타입·상태코드)을 추출한다.
3. `docs/api.md` 의 기존 표기 형식에 맞춰 항목을 추가한다.
4. 예시 요청/응답을 한 쌍 포함한다.
5. 추가한 엔드포인트 수를 한 줄로 보고한다.

## 예시
입력: "방금 만든 GET /products/search 문서에 넣어줘"
출력: docs/api.md 에 1개 엔드포인트 추가 (요청 q, 응답 { products, total })
```

# 마이그레이션 안전 점검

## 언제 쓰나
DB 스키마를 바꾸는 마이그레이션을 만들거나 리뷰할 때.

## 단계
1. 변경 유형을 분류한다: 추가 / 변경 / 삭제.
2. 위험 신호를 짚는다 — 컬럼·테이블 삭제, 기본값 없는 NOT NULL 추가,
   대용량 테이블의 인덱스 변경(락 가능성).
3. 각 위험에 대해 되돌리기(down) 경로가 있는지 확인한다.
4. 무중단이 필요하면 단계 분리(추가 → 백필 → 제약)를 제안한다.
5. 위험도(낮음/주의/높음)와 권고를 한 줄씩 요약한다.

## 예시
입력: "users 테이블에 email NOT NULL 컬럼 추가하는 마이그레이션"
출력: [주의] 기존 행에 email 없음 → 기본값/백필 없이 NOT NULL 추가 불가. 2단계 분리 권고.
```

# 접근성(a11y) 점검

## 언제 쓰나
인터랙티브 UI 컴포넌트(버튼, 폼, 이미지, 모달 등)를 만들거나 고칠 때.

## 단계
1. 이미지에 `alt`, 폼 입력에 연결된 `label`이 있는지 본다.
2. 클릭 가능한 요소가 키보드(Tab·Enter)로도 동작하는지 확인한다.
3. 아이콘 전용 버튼에 `aria-label`이 있는지 점검한다.
4. 색만으로 정보를 전달하지 않는지(대비·텍스트 병기) 확인한다.
5. 누락 항목을 체크리스트로 보고하고 수정안을 제시한다.

## 예시
입력: "이 아이콘 버튼 컴포넌트 봐줘"
출력: [누락] aria-label 없음 → 스크린리더가 "버튼"으로만 읽음. aria-label="삭제" 추가 권고.
```

> [!NOTE] 좋은 description = 높은 발동률
> 네 예제의 본문 절차는 도메인마다 다르지만, ==공통점은 description이 "언제 깨어나는지"를 또렷이 못박았다==는 것이다(§3). "커밋할 때", "라우트 추가 직후", "스키마 변경 시", "UI 작업 시" — 트리거 상황이 분명할수록 제때 발동한다. 반대로 "커밋 도우미", "API 유틸"처럼 ==기능만 적으면== 영영 안 불려 나온다. 새 스킬을 만들 때 description부터, 그것도 "**~할 때 사용한다**"로 쓰자.

---

## ✅ 한 문장 요약

> [!TIP] 한 문장 요약
> ==스킬은 description을 보고 에이전트가 알아서 발동하는 재사용 능력이다.== 규칙(항상)·커맨드(내가 호출)와 달리 상황이 맞으면 자동으로 깨어나며, ==좋은 description이 곧 발동률==이다. 팀 레포에 커밋해 노하우를 공유하되, 진짜 반복되는 워크플로만 스킬로 굳혀 과함을 경계한다.

## 확인 문제

**Q1.** "들여쓰기는 항상 2칸, 커밋 메시지는 한글로"처럼 ==모든 작업에 늘 적용==하고 싶은 지침이 있다. 규칙·스킬·커맨드 중 무엇이 맞나?

> **정답:** 규칙(`CLAUDE.md` 등).
> **해설:** 항상 참인 전제·관례는 상시 주입되는 규칙에 넣는다(§2). 가끔만 쓰는 걸 규칙에 넣으면 매번 컨텍스트만 차지한다. 스킬은 "가끔, 상황 맞을 때", 커맨드는 "내가 직접 호출"일 때다.

**Q2.** 스킬을 만들어 등록했는데 아무리 관련 요청을 해도 발동되지 않는다. 가장 먼저 의심할 곳은?

> **정답:** `description`(언제 쓰는지)이 모호하거나 빠졌다.
> **해설:** 스킬의 발동 트리거는 곧 description이다(§3). ==무엇을 하는지==만 적고 ==언제 쓰는지==를 빠뜨리면 에이전트가 상황과 매칭하지 못해 영영 안 불려 나온다. "~할 때 사용한다"를 또렷이 적는다.

**Q3.** 팀이 자주 헷갈려 하는 작업마다 스킬을 30개 넘게 만들었더니, 에이전트가 엉뚱한 스킬을 꺼내 쓰기 시작했다. 무엇이 문제인가?

> **정답:** ==스킬 과잉==으로 인한 혼동·오발동.
> **해설:** 스킬이 많아지면 description끼리 겹쳐 잘못 매칭되고, 에이전트가 무엇을 쓸지 혼동한다(§5). 진짜 반복되고 절차가 고정된 것만 스킬로 남기고 나머지는 정리한다. 적고 또렷할수록 좋다.
