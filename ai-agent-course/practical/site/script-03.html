<script type="text/markdown" id="md-src"># 세션 3 해설 스크립트 — 스킬(Skills) 만들고 쓰기

> 🎙️ 이 문서는 강사가 그대로 읽거나 참고해 설명할 수 있는 해설 대본입니다. 본문: [세션 3 강의 자료](session-03.html)
>
> (기준 시점 2026-06 · 스킬의 폴더 구조·필드 이름은 버전마다 다를 수 있으니, "자동 발동되는 재사용 능력"이라는 원리를 중심으로 전달)

## [프레이밍 · 8분] 커맨드는 내가 부른다, 스킬은 알아서 온다

🎙️ 세 번째 시간이에요. 지난 시간에 커스텀 슬래시 커맨드를 만들었죠? `/pr-check` 이렇게 내가 직접 쳐서 부르는 거요. 오늘은 한 단계 위로 갑니다. 내가 부르지 않아도, 필요한 상황이 오면 에이전트가 알아서 꺼내 쓰는 능력 — 그게 **스킬**이에요.

차이를 딱 한 문장으로 잡아볼게요. **커맨드는 내가 부르고, 스킬은 알아서 와요.** 예를 들어 "이 PDF에서 표 좀 뽑아줘"라고만 했는데, 내가 어떤 명령도 안 쳤는데도 표 추출 스킬이 알아서 발동돼서 일을 처리하는 거예요. 비유하면, 커맨드는 내가 "사전 가져와"라고 부르는 거고, 스킬은 모르는 단어가 나오면 옆 사람이 알아서 사전을 펴주는 거예요.

🎙️ 오늘 진짜 중요한 건 셋의 구분이에요. **규칙, 스킬, 커맨드.** 이 세 개가 어떻게 다른지 또렷이 가르는 게 오늘의 뼈대고요. 그다음 스킬을 직접 만들어 보고, 팀과 공유하는 법, 그리고 스킬을 너무 많이 만들면 왜 독이 되는지까지 다룰게요.

## [핵심① · 20분] 규칙 vs 스킬 vs 커맨드

🎙️ 화면 비교표를 같이 볼게요. 셋의 결정적 차이는 딱 하나예요 — **무엇이 발동을 일으키는가.**

첫째 규칙. 이건 **항상 주입**돼요. 매 대화에 늘 깔려 있어요. CLAUDE.md에 적는 것들이죠. "들여쓰기는 2칸", "커밋 메시지는 한글로" 같은, 모든 작업에 늘 참인 것만 넣어요. 둘째 커맨드. 이건 **내가 슬래시로 직접 호출**해요. 언제 쓸지 내가 알고, 내가 의식적으로 불러요. 셋째 스킬. 이게 오늘 주인공인데, **상황이 맞으면 에이전트가 자동으로** 꺼내 써요. 평소엔 잠자코 있다가, 맞는 상황이 오면 깨어나는 거예요.

🎙️ 정리하면 이래요. 규칙은 항상 켜져 있으니까 늘 필요한 것만 넣어야 해요. 가끔만 쓰는 걸 규칙에 박으면 매번 컨텍스트만 잡아먹어요. 커맨드는 내가 부르는 거니까 내가 언제 쓸지 알 때. 스킬은 그 중간, 평소엔 자고 있다가 상황 맞으면 알아서 오는 거예요.

🎙️ 그래서 새 능력을 추가할 때 한 줄 질문만 하면 돼요. **늘 필요한가? 규칙. 가끔, 특정 상황에만? 스킬. 내가 직접 부르고 싶나? 커맨드.** 이 셋만 구분하면 거의 다 정리돼요.

💬 예상 질문: "규칙에 다 넣으면 항상 적용되니까 편하지 않아요?" → 편해 보이지만 독이에요. 규칙은 매 대화에 항상 들어가니까, 가끔 쓰는 절차까지 넣으면 컨텍스트가 늘 무거워지고, 정작 안 쓸 땐 방해가 돼요. "항상 참인 것"만 규칙에 넣으세요.

## [핵심② · 18분] 발동 원리 — description이 곧 트리거

🎙️ 자, 그럼 스킬이 *어떻게* 알아서 불려 나올까요? 비밀은 의외로 단순해요. 각 스킬에는 "언제 쓰는지"를 적은 **description**이 있어요. 에이전트는 그 설명을 읽고, 지금 상황에 맞으면 발동해요. 그러니까 **description이 곧 트리거 조건**이에요.

화면 흐름을 볼게요. 사용자가 "이 엑셀에서 매출 합계 계산해줘"라고 해요. 그럼 에이전트가 등록된 스킬들의 description을 쭉 훑어요. "스프레드시트 데이터 집계가 필요할 때 사용" 같은 설명이랑 매칭되면, 그 스킬을 발동해서 절차대로 처리하는 거예요.

🎙️ 그래서 제가 오늘 제일 강조하고 싶은 한마디는 이거예요 — **좋은 description이 곧 발동률이다.** 설명이 또렷하면 제때 불려 나오고, 모호하면 영영 안 불려 나와요. 스킬을 아무리 잘 만들어도 description이 흐리면 아예 안 깨어나요.

🎙️ 화면 표의 나쁜 예 좋은 예를 보세요. "유틸리티"? 언제 쓰는지가 없으니까 영영 안 발동돼요. "데이터 처리"? 너무 넓어서 엉뚱하게 오발동해요. 반면 "PDF에서 표를 추출해 CSV로 변환할 때 사용", "사내 결제 로그를 일자별로 집계할 때" — 이렇게 **상황**이 박혀 있어야 제대로 매칭돼요.

🎙️ 여기서 흔한 실수 하나 꼭 짚을게요. description에 **무엇을 하는지**만 적고 **언제 쓰는지**를 빠뜨리는 거예요. "표를 CSV로 바꾼다"보다 "표를 CSV로 바꿔야 *할 때* 사용한다"가 핵심이에요. 에이전트는 기능 목록이 아니라 *상황*을 보고 고르거든요. 사람으로 치면, 도구함에 "망치"라고만 써놓는 게 아니라 "못 박을 때 쓰는 망치"라고 써두는 거예요.

💬 예상 질문: "그럼 description을 길고 자세하게 쓸수록 좋나요?" → 길이보다 **트리거 상황이 또렷한가**가 중요해요. "~할 때 사용"이라는 발동 조건이 분명하면 짧아도 돼요. 반대로 길어도 상황이 안 보이면 소용없어요.

## [핵심③ · 22분] 스킬 직접 작성 — SKILL.md

🎙️ 이제 직접 만들어 볼게요. 스킬은 **폴더 하나**로 만들어요. 핵심은 그 안의 `SKILL.md`예요.

화면처럼 위치는 두 군데예요. `.claude/skills/스킬이름/SKILL.md`는 프로젝트용이라 팀과 공유되고 git에 커밋돼요. `~/.claude/skills/스킬이름/SKILL.md`는 개인용이고요. 지난 시간 커맨드 위치랑 구조가 비슷하죠? 그리고 스킬은 폴더라서, 그 안에 보조 파일이나 스크립트도 같이 둘 수 있어요. 예를 들어 표 추출 절차가 부르는 `extract.py` 같은 헬퍼를요.

🎙️ 화면의 `pdf-table` 예시를 보세요. 위에 frontmatter로 `name`이랑 `description`을 적어요. name은 짧은 식별자, 보통 폴더 이름이랑 맞추고요. description은 아까 말한 그 발동 조건, 제일 중요한 한 줄이에요. 그리고 본문에는 "언제 쓰나 → 단계 → 예시" 순서로 사람이 읽듯 또렷하게 적어요. 화면 보면 언제 쓰는지 한 줄, 단계 1번부터 4번까지, 그리고 입력 출력 예시까지 있죠.

🎙️ 여기서 지난 시간 커맨드랑 비교를 한번 해볼게요. 둘 다 마크다운에 frontmatter 쓰는 거 똑같아요. 그런데 결정적 차이가 하나 있어요. 커맨드는 `/이름`으로 **내가 호출**하고, 스킬은 description을 보고 **에이전트가 호출**해요. 그래서 스킬은 description에 모든 게 걸려 있는 거예요. 절차를 아무리 잘 써도 description이 흐리면 그 절차가 실행될 기회조차 없어요.

💬 예상 질문: "절차가 엄청 길면 SKILL.md가 지저분해지지 않나요?" → 그래서 폴더예요. 긴 절차나 코드는 보조 파일로 빼고, SKILL.md는 "언제 쓰나, 단계 요약, 그 파일을 부른다"만 또렷하게 두면 돼요. 스킬 본체는 가볍게, 무거운 건 헬퍼로.

## [핵심④ · 12분] 팀 공유 + 과한 스킬 경계

🎙️ 두 가지를 묶어서 마무리할게요. 먼저 팀 공유예요. 스킬을 프로젝트 경로 `.claude/skills/`에 두고 git에 커밋하면, 그 레포를 받은 팀원 모두가 같은 능력을 갖게 돼요. 사내 API 호출 규약이라든지, 우리 팀만의 배포 체크리스트 같은 조직 지식을 스킬로 굳히면 엄청 강력해요. 그리고 플러그인 형태로 묶여서 배포되는 스킬도 있어요. 설치하면 같이 따라오는 거죠.

🎙️ 이게 왜 좋냐면, 스킬은 **팀의 노하우를 코드처럼 버전 관리**하는 거예요. 베테랑 머릿속에만 있던 "이건 이렇게 처리해"를 스킬로 적어서 커밋하면, 신규 멤버의 에이전트도 그 노하우를 자동으로 꺼내 써요. 문서로만 두면 아무도 안 읽잖아요. 그런데 스킬은 상황이 오면 알아서 발동하니까, 읽으라고 안 해도 적용돼요.

🎙️ 그런데 여기서 꼭 경고할 게 있어요. 스킬이 강력하다고 **아무거나 다 스킬로 만들면 역효과**예요. 스킬이 너무 많아지면 세 가지 문제가 생겨요. 하나, 에이전트가 어떤 걸 써야 할지 혼동하거나 엉뚱한 걸 오발동해요. 둘, description끼리 겹쳐서 잘못 매칭돼요. 아까 말한 "너무 넓은 description" 문제가 떼로 터지는 거예요. 셋, 관리 부담만 늘고 정작 발동은 안 돼요.

🎙️ 그래서 기준은 명확해요 — **진짜 반복되는 워크플로만 스킬로.** 한 번 쓰고 말 일, 매번 내용이 달라지는 일은 스킬로 만들지 마세요. 정말 반복되고, 절차가 고정되고, 자동 발동이 이득인 것만 굳히는 거예요. 지난 시간 커맨드의 "세 번 이상, 단계 고정" 기준 기억나시죠? 같은 정신이에요. 스킬 개수는 적고 또렷할수록 좋아요.

💬 예상 질문: "그럼 스킬은 몇 개쯤이 적당해요?" → 숫자보다 기준이에요. "이게 정말 반복되나, 자동 발동이 이득인가"를 통과한 것만 남기세요. 통과 못 하면 그냥 말로 시키거나 커맨드로 두는 게 나아요. 헷갈리는 스킬 30개보다 또렷한 5개가 훨씬 잘 동작해요.

## [실습·정리 · 10분] 내 반복 워크플로 하나를 스킬로

🎙️ 마무리 실습이에요. 여러분이 최근에 두세 번 이상 반복한 작업 하나를 떠올려 보세요. 그걸 스킬로 만들어 보는 거예요. 폴더 만들고, SKILL.md에 name이랑 description을 적되 — 특히 **description은 "~할 때 사용한다"** 형태로 발동 조건을 또렷이 적고 — 단계랑 예시를 채워 보세요. 그리고 관련 상황을 만들어서 진짜 자동 발동되는지 확인하는 게 핵심이에요.

한 문장으로 정리할게요 — **스킬은 description을 보고 에이전트가 알아서 발동하는 재사용 능력이에요.** 규칙은 항상, 커맨드는 내가 호출, 스킬은 상황 맞으면 자동. 좋은 description이 곧 발동률이고, 팀 레포에 커밋해서 노하우를 공유하되, 진짜 반복되는 워크플로만 스킬로 굳혀서 과함을 경계한다.

다음 시간엔 한 작업을 여러 에이전트에게 나눠서 동시에 굴리는 법, 서브에이전트랑 멀티 에이전트를 다룰게요. 일을 위임하고, 병렬로 배치하고, 파일 충돌 피하면서 결과를 통합하는 거예요. 세션 1에서 배운 "백지 상태 가정"이랑 "스코프 쪼개기"가 거기서 결정적으로 쓰여요. 수고하셨습니다. 질문 받을게요.</script>
