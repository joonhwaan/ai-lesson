<script type="text/markdown" id="md-src"># 세션 06 — 실전 시나리오 E2E

> 코딩 에이전트 실전 트랙의 ==마지막 세션==. 명령(세션 2)·스킬(세션 3)·멀티 에이전트(세션 4)·커스터마이징(세션 5)을 따로따로 배웠다. 오늘은 그걸 **하나의 흐름**으로 굴린다 — 작은 기능 하나를 탐색에서 커밋까지, 디버깅 하나를 재현에서 회귀 테스트까지. 세션 1의 루프가 여기서 완성형이 된다.
>
> [[chip:info: 기준 시점 2026-06]] 명령·UI는 바뀐다. 오늘 보는 건 ==변하지 않는 E2E 흐름과 검증 게이트==이고, 명령은 예시로 든다.

## 학습 목표

- 기능 구현·디버깅·리팩터·리뷰를 ==한 흐름==으로 굴릴 수 있다
- 각 단계에 **검증 게이트**(테스트·타입·브라우저)를 박아 ==silent fail==을 방어한다
- 대규모·멀티파일 작업을 스코프를 쪼개 안전하게 끌고 간다
- 트랙 전체(세션 1~6)를 하나의 작업 습관으로 ==종합==한다

## 회차 타임라인 (총 90분)

| 시간 | 구간 | 내용 |
|------|------|------|
| 0–8분 | 프레이밍 | 따로 배운 걸 한 흐름으로 — E2E란 무엇인가 |
| 8–24분 | 핵심① | E2E 흐름 — 탐색→계획→구현→검증→리뷰→커밋 |
| 24–40분 | 핵심② | 기능 구현 시나리오 (플랜→구현→테스트) |
| 40–54분 | 핵심③ | 디버깅 시나리오 (재현→가설→계측→수정→회귀) |
| 54–66분 | 핵심④ | 대규모·멀티파일 리팩터를 안전하게 |
| 66–76분 | 핵심⑤ | 코드리뷰·PR 워크플로 |
| 76–84분 | 핵심⑥ | 흔한 실패 방어 — silent fail과 검증 게이트 |
| 84–90분 | 회고·정리 | 트랙 전체 종합 |

---

## 1. E2E 흐름 — 세션 1 루프의 완성형

세션 1에서 ==탐색 → 계획 → 실행 → 검증== 루프를 배웠다. 실전에서는 그 끝에 **리뷰**와 **커밋**이 붙는다. 한 작업을 처음부터 끝까지 굴리는 전체 그림은 이렇다.

```mermaid
flowchart LR
  E[탐색<br/>관련 파일·패턴] --> P[계획<br/>플랜 모드 승인]
  P --> X[구현<br/>코드 작성·수정]
  X --> V[검증<br/>테스트·타입·실행]
  V -- 실패 --> P
  V -- 통과 --> R[리뷰<br/>/review·스스로 점검]
  R -- 지적 --> X
  R -- 통과 --> C[커밋<br/>작은 단위로]
```

| 단계 | 무엇을 | 세션 연결 |
|------|--------|-----------|
| **탐색** | 관련 파일·기존 패턴·제약 읽힌다 | 세션 1 · 입문 레슨 08 |
| **계획** | 플랜 모드로 받아 검토·승인 | 세션 1 |
| **구현** | 계획대로 작성, 벗어나면 잡는다 | 세션 1 · 입문 레슨 09 |
| **검증** | 테스트·타입·브라우저로 확인 | 세션 1 · 입문 레슨 10 |
| **리뷰** | `/review` + 빈 catch·엣지케이스 점검 | 세션 2 · 입문 레슨 11 |
| **커밋** | 검증된 작은 단위로 기록 | 세션 2 |

> [!TIP] E2E의 핵심은 "끊김 없이 한 바퀴"
> 단계를 다 안다고 흐름이 되는 건 아니다. ==한 작업이 탐색에서 커밋까지 끊김 없이 한 바퀴 도는 것==을 한 번 직접 해봐야 손에 붙는다. 오늘은 그 한 바퀴를 두 시나리오(기능·디버깅)로 돌려본다.

---

## 2. 기능 구현 시나리오 — 플랜에서 테스트까지

작은 기능 하나를 ==한 흐름==으로 끝까지 굴려보자. 입문 레슨 09에서 배운 "계획 우선 기능 구현"의 실전판이다.

```text
[시나리오: 상품 목록에 정렬 옵션 추가]

① 탐색   "상품 목록 라우트와 프런트 컴포넌트 찾아서 어떻게 동작하는지 설명해줘"
         → src/routes/products.js, src/pages/Products.jsx 파악

② 계획   플랜 모드로: "정렬 파라미터를 추가하려 한다. 먼저 계획만."
         → 에이전트가 변경 파일·접근·순서 제시 → 내가 검토·승인

③ 구현   승인 후 편집. GET /products?sort=price → 정렬된 { products, total }
         참조: 기존 목록 라우트의 에러 처리 패턴과 동일하게

④ 검증   !npm test  + sort=price 로 호출해 순서 확인 + 브라우저에서 눈으로

⑤ 리뷰·커밋   /review → 지적 반영 → 작은 단위 커밋
```

> [!NOTE] 기능은 "검증 가능한 가장 작은 단위"로
> 정렬·필터·페이지네이션을 한 번에 시키지 말고, ==정렬 하나==를 끝까지 굴린 뒤 다음으로. 세션 1의 스코프 쪼개기가 그대로 적용된다. 한 사이클 끝마다 "이게 됐다"가 녹색이어야 다음 칸으로 간다.

---

## 3. 디버깅 시나리오 — 재현에서 회귀 테스트까지

버그는 "고쳐줘" 한 줄로 되지 않는다. ==재현 → 가설 → 계측 → 수정 → 회귀 테스트== 순서를 지킨다. 입문 레슨 10의 디버깅 흐름을 에이전트와 함께 도는 것이다.

| 단계 | 무엇을 | 에이전트에게 |
|------|--------|--------------|
| **재현** | 버그가 ==확실히 나는 조건== 고정 | "이 입력으로 항상 재현된다. 먼저 재현 경로를 확인해줘" |
| **가설** | 원인 후보를 좁힌다 | "어디서 깨지는지 가설 2~3개와 근거를" |
| **계측** | 로그·중단점으로 ==사실 확인== | "해당 함수에 임시 로그 넣어 실제 값 찍어보자" |
| **수정** | 근본 원인만 고친다 | "원인이 확인됐으니 최소 변경으로 수정" |
| **회귀** | ==같은 버그 재발 방지== 테스트 | "이 버그를 잡는 테스트를 먼저 추가하고 통과 확인" |

> [!WARNING] 가설 없이 바로 "고쳐줘"의 함정
> 재현·계측을 건너뛰고 바로 고치게 두면, 에이전트는 ==증상만 가린다==(엉뚱한 곳에 방어 코드, 빈 catch). 원인을 사실로 확인하기 전엔 수정하지 않는다. 그리고 ==고친 다음 회귀 테스트를 남겨== 다음에 또 깨지면 즉시 잡히게 한다.

---

## 4. 대규모·멀티파일 리팩터를 안전하게

여러 파일을 동시에 건드리는 작업은 가장 사고가 잦다. 세션 4의 ==배치 전략·통합 검증==을 그대로 재사용한다.

```text
[안전한 멀티파일 리팩터]
1) 스코프 쪼개기   "전부 한 번에" 금지 → 파일/기능 단위로 분할
2) 공유 파일은 한 곳에   index.js·database.js 같은 공유 파일은
                       한 에이전트(또는 한 단계)에 몰아 충돌 방지
3) 단계마다 녹색   각 묶음 끝에 테스트·타입 통과 확인 후 다음
4) 통합 검증       병렬·분할 후 반드시 인터페이스 교차 검증
                  (서버 응답 필드 ↔ 클라이언트 기대값 일치?)
5) 작은 커밋 여러 개   한 덩어리 커밋 대신 검증된 단위로 나눠 커밋
```

> [!IMPORTANT] 멀티파일에서 silent fail이 가장 잘 숨는다
> 같은 작업을 여러 곳에 흩어 고치면, 한 곳의 누락이 ==조용히== 지나간다(import 빠짐, 라우트 순서 어긋남, 응답 필드 불일치). 세션 4의 통합 검증 체크리스트 — ==API 인터페이스·공유 파일·import·라우트 순서·스키마·브라우저 E2E== — 를 마지막 게이트로 반드시 통과시킨다.

---

## 5. 코드리뷰·PR 워크플로

구현이 끝났다고 끝이 아니다. ==검증된 변경을 리뷰하고 작은 PR로 기록==한다. 세션 2의 `/review`와 입문 레슨 11의 리뷰 관점이 여기서 만난다.

```bash
# 변경분 마무리 레시피 (세션 2 레시피 A의 실전형)
!git diff --stat     # 변경 범위 한눈에
/review              # 에이전트 리뷰 — 버그·엣지케이스·빈 catch
# (지적 반영)
!npm test            # 검증 게이트
# 작은 단위 커밋 → PR
```

> [!TIP] 리뷰는 "내가 안 본 눈"으로 한 번 더
> 내가 짠 흐름은 ==내 가정에 갇혀== 있다. `/review`로 다른 관점을 한 번 통과시키면 빈 catch, 처리 안 한 엣지케이스, 누락된 검증이 드러난다. PR은 ==작게== — 작은 PR은 리뷰가 쉽고 되돌리기도 쉽다(세션 1 스코프 쪼개기의 결과물).

---

## 6. 흔한 실패 방어 — silent fail과 검증 게이트

트랙 내내 반복된 단 하나의 적: ==조용한 실패==. "됐다는데 안 돌아간다"는 거의 다 여기서 나온다.

| 실패 유형 | 증상 | 게이트 |
|-----------|------|--------|
| **빈 catch** | `catch(e){}` 가 에러를 삼킴 | 리뷰에서 ==빈 catch 금지==, 최소 `console.error` |
| **응답 불일치** | 서버 `{messages}` ↔ 클라 `res.data.room` | ==API 인터페이스 교차 검증==(세션 4) |
| **"됐다"는 환각** | 테스트 없이 통과 주장 | ==테스트·타입·브라우저== 게이트 통과 전 미완 |
| **잔상 오염** | 옛 맥락이 새 작업 오염 | 작업 전환 시 `/clear`(세션 1) |

> [!WARNING] 검증 게이트를 통과하기 전엔 "완료"가 아니다
> 에이전트가 "다 됐어요"라고 해도, ==테스트가 녹색이고·타입이 맞고·브라우저에서 눈으로 확인==되기 전까지는 완료가 아니다. 이 게이트 하나가 트랙 전체에서 가장 비싼 버그들을 막는다. 빈 catch는 ==문제를 숨기므로 금지==.

---

## 7. 트랙 회고 — 세션 1~6 종합

여섯 세션은 따로 노는 주제가 아니라, ==하나의 작업 습관==을 쌓아온 것이다.

```text
세션 1  워크플로     탐색→계획→실행→검증 루프      ← 모든 것의 뼈대
세션 2  명령         루프를 빠르게 굴리는 단축키      ← 손동작
세션 3  스킬         특정 상황에 자동 발동되는 능력    ← 자동화
세션 4  멀티 에이전트  큰 작업을 쪼개 병렬·통합        ← 규모
세션 5  커스터마이징   규칙·훅·MCP로 환경을 내 것으로   ← 환경
세션 6  E2E          위 전부를 한 흐름으로 굴린다      ← 종합
                     ─────────────────────────────
                     전부 = "워크플로를 잘 굴린다"
```

> [!NOTE] 도구는 바뀌어도 흐름은 남는다
> 명령 이름·UI·스킬 형식은 버전마다 바뀐다. 하지만 ==탐색에서 검증·리뷰·커밋까지 작은 단위로 도는 흐름==은 도구가 바뀌어도 그대로다. 트랙에서 진짜 가져갈 건 특정 명령이 아니라 ==이 흐름을 몸에 새기는 것==이다.

## 📚 실전 예제 모음

도메인은 달라도 흐름은 같다. 백엔드·프런트엔드·CLI·데이터, 네 가지 완결 워크스루를 ==탐색→계획→구현→검증== 한 바퀴로 굴려본다. 세션 1~5에서 배운 걸 각 단계에 끼워 넣는 게 핵심이다.

**예제 1 — REST 엔드포인트 추가 (백엔드)**

상품에 "재고 알림 구독" API 하나를 새로 붙이는 작업이다. 기능 하나를 끝까지 굴린다.

```text
[POST /products/:id/subscribe 추가]

① 탐색   @src/routes/products.js  "이 라우트 파일이 어떻게 구성됐고
         DB 접근·에러 처리 패턴이 뭔지 설명해줘" (세션 1 탐색 / 세션 2 @참조)
         → 기존 라우트들의 미들웨어·응답 형식 { ok, data } 파악

② 계획   플랜 모드: "구독 엔드포인트를 추가하려 한다. 먼저 계획만."
         → 변경 파일(routes·db 스키마)·라우트 등록 위치 제시 → 검토·승인
         (주의: :id 와일드카드보다 구체 경로를 먼저 등록 — 세션 4 라우트 순서)

③ 구현   승인 후 편집. POST /products/:id/subscribe → { ok: true, data }
         참조: 기존 라우트의 에러 처리 패턴과 동일하게, 빈 catch 금지

④ 검증   !npm test  + !curl 로 직접 호출해 201/응답 형식 확인
         → 응답 필드명이 기존 { ok, data } 규약과 일치하는지 교차 검증

⑤ 리뷰·커밋   /review → 지적 반영 → "feat: 재고 알림 구독 API" 작은 커밋
```

**예제 2 — 프런트엔드 UI 버그 수정**

"정렬 드롭다운을 바꿔도 목록이 안 바뀐다"는 버그. 재현부터 회귀까지 §3 흐름을 그대로 탄다.

```text
[정렬 변경이 목록에 반영 안 됨]

① 재현   "sort=price 로 바꿔도 목록 순서가 그대로다. 항상 재현된다.
         먼저 재현 경로부터 확인해줘" (세션 1 / §3 재현)
         → 드롭다운 onChange → 상태는 바뀌는데 요청에 안 실림 의심

② 가설   "어디서 끊기는지 가설 2~3개와 근거를"
         → (a) state는 갱신되나 useEffect 의존성 누락 (b) 쿼리스트링 미반영

③ 계측   @src/pages/Products.jsx  "fetch 직전에 임시 로그로 실제 sort 값 찍자"
         → 콘솔에 sort=undefined 확인 → 가설(a) 사실로 확정

④ 수정   "원인 확인됐다. useEffect 의존성에 sort 추가, 최소 변경으로"

⑤ 회귀·검증   "정렬 변경 시 요청 파라미터가 실리는지 테스트 먼저 추가"
            → !npm test 통과 + 브라우저에서 눈으로 순서 바뀜 확인 (세션 1 검증 게이트)
```

**예제 3 — CLI 도구 하나 만들기**

프로젝트 안에 "TODO 주석을 모아 출력하는" 작은 CLI를 새로 만든다. 0→1 기능을 한 바퀴로.

```text
[scripts/find-todos.js — TODO 주석 수집 CLI]

① 탐색   "이 레포의 스크립트 실행 방식(package.json scripts)과
         Node 버전·모듈 방식(ESM/CJS)을 확인해줘" → 환경 제약 파악

② 계획   플랜 모드: "src 전체에서 // TODO 를 찾아 파일:줄:내용 으로
         출력하는 CLI. 인자로 경로를 받게. 먼저 계획만."
         → 파일 1개·의존성 없음(표준 라이브러리만)·출력 형식 합의

③ 구현   승인 후 작성. 에러 시 빈 catch 금지 — 최소 console.error + 비정상 종료코드

④ 검증   !node scripts/find-todos.js src  로 직접 실행해 출력 확인
         + 일부러 TODO 없는 디렉터리로도 호출해 엣지케이스(0건) 확인

⑤ 커밋   "feat: TODO 주석 수집 CLI 추가" — 작은 단위로 기록
```

**예제 4 — 데이터 정제 스크립트**

지저분한 CSV를 정제하는 일회성 스크립트. 출력이 정답인지 ==눈으로 검증==하는 게 관건이다.

```text
[clean-users.py — 사용자 CSV 정제]

① 탐색   @data/users_raw.csv  "이 CSV의 컬럼·결측·중복·인코딩 문제를
         먼저 진단해줘. 고치기 전에 현황만." (탐색 우선 — 세션 1)
         → 빈 이메일, 공백·대소문자 섞인 중복, 깨진 날짜 형식 발견

② 계획   "결측 행 제외 → 이메일 소문자화 → 중복 제거 → 날짜 ISO 통일.
         원본은 건드리지 말고 users_clean.csv 로 출력. 먼저 계획만."

③ 구현   승인 후 작성. 정제 규칙마다 처리 건수를 stderr 로 찍어 추적 가능하게

④ 검증   !python clean-users.py  + 입력/출력 행 수 대조
         + 정제된 파일 상위 몇 줄을 ==눈으로== 확인(자동 검증만으론 부족)
         → "조용히 멀쩡한 데이터까지 날리지 않았는지" 표본 점검

⑤ 커밋   "chore: 사용자 CSV 정제 스크립트" — 원본 CSV는 그대로 보존
```

> [!TIP] 도메인이 달라도 루프는 같다
> 백엔드 API든 프런트 버그든 CLI든 데이터 스크립트든, 보이는 코드는 다르지만 ==탐색→계획→구현→검증→커밋== 한 바퀴와 ==검증 게이트==는 똑같다. 달라지는 건 "무엇으로 검증하느냐"뿐이다 — API는 호출·응답 형식, UI는 브라우저 눈 확인, CLI는 직접 실행, 데이터는 표본 대조. ==흐름을 손에 새기면 처음 보는 도메인도 같은 리듬으로 굴릴 수 있다.==

---

## ✅ 한 문장 요약

> [!TIP] 한 문장 요약
> ==에이전트를 잘 쓴다 = 워크플로를 잘 굴린다.== 기능이든 버그든 리팩터든, 탐색→계획→구현→검증→리뷰→커밋을 작은 단위로 돌리고, 각 단계에 검증 게이트를 박아 silent fail을 막는다. 트랙 1~6은 결국 이 한 흐름을 손에 새기는 과정이었다.

## 확인 문제

**Q1.** 버그 리포트를 받자마자 에이전트에게 "이거 고쳐줘"라고 시켰더니, 엉뚱한 곳에 빈 `catch`가 생기고 증상만 가려졌다. 디버깅 흐름에서 무엇이 빠졌나?

> **정답:** 재현·가설·계측 단계, 그리고 회귀 테스트.
> **해설:** 원인을 ==사실로 확인==하기 전에 수정하면 증상만 가린다(§3). 재현으로 조건을 고정하고, 가설을 좁히고, 계측으로 확인한 뒤 최소 변경으로 고치고, 회귀 테스트를 남겨야 한다. 빈 catch는 금지(§6).

**Q2.** 여러 파일에 걸친 리팩터를 마쳤고 에이전트가 "다 됐어요"라고 한다. 커밋 전에 반드시 통과시켜야 할 것은?

> **정답:** 검증 게이트 — 테스트·타입·브라우저 + ==API 인터페이스 교차 검증==.
> **해설:** 멀티파일에서는 import 누락·라우트 순서·응답 필드 불일치 같은 ==silent fail이 가장 잘 숨는다==(§4·§6). "됐다"는 주장만으로는 완료가 아니다. 게이트가 녹색일 때 비로소 완료다.

**Q3.** 이 트랙 전체를 한 문장으로 요약한다면? 그리고 그 핵심이 세션 1과 어떻게 이어지나?

> **정답:** "에이전트를 잘 쓴다 = 워크플로를 잘 굴린다." 세션 1의 탐색→계획→실행→검증 루프가 그 뼈대다.
> **해설:** 명령(2)·스킬(3)·멀티 에이전트(4)·커스터마이징(5)은 모두 세션 1 루프 위에 얹힌 것이고, 세션 6은 그 전부를 한 흐름으로 종합한다(§1·§7). 도구는 바뀌어도 흐름은 남는다.

## 다음 세션 예고

여기까지 코딩 에이전트를 ==빠르고 효율적으로 잘 쓰는== 법을 끝까지 엮었다. 트랙에서 단 하나만 가져간다면 — ==에이전트를 잘 쓴다는 건 화려한 명령을 외우는 게 아니라, 탐색에서 커밋까지 작은 흐름을 끊김 없이 굴리는 것==이다.

그런데 빠름에는 짝이 있어야 한다. 다음 마지막 세션(**세션 7 — 안전하게 운영하기: 가드레일 & 하네스 이해**)에서는 ==안전==을 다룬다. 코딩 에이전트는 파일을 쓰고 셸을 실행한다 — 강력한 만큼 위험하다. 내가 쓰는 도구를 **하네스**로 이해하고, 권한·승인 게이트·인젝션 방어 같은 **가드레일**로 사고를 막는 법으로 트랙을 닫는다.
