name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1개만 (중복 실행 취소)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages 자동 활성화(Settings 토글 없이 워크플로가 켬)
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ai-agent-course/ 를 사이트 루트로 업로드 (portal index.html 이 첫 화면)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-agent-course

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
